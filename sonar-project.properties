# SonarQube 設定檔，適用於 Angular/Jest 專案
# 此檔案會由 sonar-scanner CLI 自動讀取

# 專案識別 依各項專案調整 repo 名稱
sonar.projectKey=cpp-web-main
sonar.projectName=CPP Web Main
sonar.projectVersion=1.0

# 原始碼位置 - 僅限前端程式碼
sonar.sources=src
sonar.sourceEncoding=UTF-8

# 明確排除可能被掃描到的檔案，即使已設定 sonar.sources=src
# 這是一個安全措施，用於排除專案根目錄的測試檔案與設定檔
sonar.inclusions=src/app/**

# 排除所有非前端檔案與目錄，避免進行分析
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.spec.new.ts,\
  **/node_modules/**,\
  **/dist/**,\
  **/.angular/**,\
  **/.scannerwork/**,\
  **/e2e/**,\
  **/out-tsc/**,\
  **/*.html,\
  **/*.css,\
  **/*.scss,\
  **/*.sass,\
  **/*.json,\
  **/*.md,\
  **/*.txt,\
  src/main.ts,\
  src/polyfills.ts,\
  src/test.ts,\
  src/test-helpers.ts,\
  src/bootstrap.ts,\
  src/karma.conf.js,\
  src/tslint.json,\
  src/typings.d.ts,\
  src/environments/**,\
  src/test/**,\
  src/assets/**,\
  src/fonts/**,\
  src/styles/**,\
  src/mock-data/**,\
  **/*.routes.ts,\
  **/*.enum.ts,\
  **/*.interface.ts,\
  **/*.model.ts,\
  **/*.type.ts,\
  **/*.d.ts,\
  **/const.ts,\
  **/version.ts

# JavaScript/TypeScript 程式碼涵蓋率
# SonarQube 內建的 JS/TS 專案涵蓋率感測器
# 使用 Jest 產生的 LCOV 格式
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# 涵蓋率設定 - 排除測試檔案與啟動檔案
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.html,\
  **/*.css,\
  **/*.scss,\
  **/*.sass,\
  setup-jest.ts,\
  src/test.ts,\
  src/test-helpers.ts,\
  src/main.ts,\
  src/polyfills.ts,\
  src/bootstrap.ts,\
  src/typings.d.ts,\
  src/test/**,\
  src/environments/**,\
  src/mock-data/**,\
  src/assets/**,\
  **/*.routes.ts,\
  **/*.config.ts,\
  **/*.enum.ts,\
  **/*.interface.ts,\
  **/*.model.ts,\
  **/*.type.ts,\
  **/*.d.ts,\
  **/const.ts,\
  **/version.ts,\
  **/static/**

# 測試檔案模式
sonar.test.inclusions=**/*.spec.ts

# 通用涵蓋率路徑，作為舊版 SonarQube 的備援
sonar.lcov.reportPaths=coverage/lcov.info

# 停用 JaCoCo 涵蓋率匯入（此為 Java 專案使用，我們採用 Jest 針對 JS/TS）
sonar.coverage.jacoco.xmlReportPaths=

# 啟用 JavaScript/TypeScript 外掛以讀取涵蓋率
sonar.lang.patterns.ts=**/*.ts
sonar.lang.patterns.js=**/*.js
