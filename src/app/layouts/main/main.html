<cub-layout-container>
  <app-header cubLayoutHeader (toggleRightSidebar)="rightToggle()" />

  <cub-layout-panel
    cubLayoutPanel
    position="start"
    [autoFocus]="false"
    [opened]="sidebar_open"
    (openedChange)="leftToggle($event)"
    [mode]="'side'"
  >
    <cub-sidebar-content>
      <div style="width: 240px">
        <ul class="sidebar-menu">
          <li><a routerLink="/todo" routerLinkActive="active">代辦事項</a></li>
          <li><a routerLink="/search" routerLinkActive="active">連線查詢</a></li>
          <li><a routerLink="/create" routerLinkActive="active">新增連線</a></li>
          <li><a routerLink="/switch" routerLinkActive="active">連線開關</a></li>
        </ul>
      </div>
    </cub-sidebar-content>
  </cub-layout-panel>

  <cub-layout-content>
    <router-outlet />
  </cub-layout-content>

  <cub-layout-panel
    cubLayoutPanel
    position="end"
    [autoFocus]="false"
    [opened]="rightSidebarOpen"
    (openedChange)="rightToggle($event)"
    [mode]="'side'"
  >
    <cub-sidebar-content>
      <div class="right-sidebar-content">
        <h3>編輯詳情</h3>
        @if (selectedItem) {
          <div class="sidebar-item-details">
            <div class="detail-row">
              <label>標題：</label>
              <span>{{ selectedItem.title }}</span>
            </div>
            <div class="detail-row">
              <label>姓名：</label>
              <span>{{ selectedItem.userName }}</span>
            </div>
            <div class="detail-row">
              <label>日期：</label>
              <span>{{ selectedItem.date }}</span>
            </div>
            <div class="detail-row">
              <label>金額：</label>
              <span>{{ selectedItem.amount | number: "1.0-0" }}</span>
            </div>
          </div>
        } @else {
          <p>請選擇一項進行編輯</p>
        }
      </div>
    </cub-sidebar-content>
  </cub-layout-panel>

  <app-footer cubLayoutFooter></app-footer>
</cub-layout-container>
