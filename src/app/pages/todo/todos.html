<div class="todos-page">
  <div class="page-header">
    <span class="page-title-bar"></span>
    <h2 class="page-title">待辦案件</h2>
  </div>

  <div class="line-tabs-section">
    <div class="line-tabs-nav">
      <button
        class="line-tab"
        [class.line-tab--active]="activeMainTab === 'case-tracking'"
        (click)="setMainTab('case-tracking')">
        案件追蹤
      </button>
      <button
        class="line-tab"
        [class.line-tab--active]="activeMainTab === 'todo-list'"
        (click)="setMainTab('todo-list')">
        待辦事項
      </button>
    </div>
    <div class="line-tabs-divider"></div>
  </div>

  @if (activeMainTab === 'case-tracking') {
    <app-case-tracking />
  }
  @if (activeMainTab === 'todo-list') {
    <app-todo-list />
  }
</div>
